<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - FAQs</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 30px; }
    .faq-list { max-width: 900px; margin: 0 auto; }
    .faq-item { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
    .controls { display:flex; gap:8px; }
    textarea { width:100%; min-height:80px; }
  </style>
</head>
<body>
  <h1>Admin — FAQ Editor</h1>
  <div class="faq-list">
    <div style="margin-bottom:16px;">
      <input id="triggers" placeholder="Comma-separated triggers (e.g. experience,freelancer)" style="width:60%; padding:8px;" />
      <button id="addFaq">Add / Update FAQ</button>
      <button id="exportChats">Export Chats (JSON)</button>
      <button id="showAnalytics">Show Analytics</button>
    </div>
    <div id="faqs"></div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
