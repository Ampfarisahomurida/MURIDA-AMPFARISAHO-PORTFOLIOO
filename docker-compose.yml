version: '3.8'

services:
  web:
    build: .
    image: murida-portfolio:local
    ports:
      - "8080:8080"
    environment:
      - ADMIN_PASSWORD=Mizzirash2
      - NODE_ENV=production
    volumes:
      # bind-mount source for quick local edits
      - ./:/usr/src/app:cached
      # persistent volume for SQLite data
      - data:/usr/src/app/MURIDA-AMPFARISAHO-PORTFOLIOO-main/data
    restart: unless-stopped

volumes:
  data:
    driver: local
